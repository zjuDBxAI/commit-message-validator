name: "Commit Message Validator"
description: "A GitHub Action to validate commit messages follow the guidelines."
branding:
  icon: "code"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token with pull-requests: read permission."
    required: true
    default: ${{ github.token }}
  scope-values:
    description: "Comma-separated allowed commit scopes."
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
